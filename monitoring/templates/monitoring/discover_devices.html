<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovered Devices</title>
</head>
<body>
    <h2>Discovered Devices</h2>
    <table border="1">

    <tr>
        <th>Hostname</th>
        <th>IP Address</th>
        <th>MAC Address</th>
        <th>Status</th>
    </tr>

    {% for device in devices %}

    <tr>
        <td>{{ device.hostname }}</td>
        <td>{{ device.ip }}</td>
        <td>{{ device.mac }}</td>
        <td>{{ device.status }}</td>
    </tr>

    {% endfor %}

</table>
</body>
</html>
